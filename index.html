<!doctype html>
<html lang="id">
  <head>
    <!-- WAJIB di baris pertama head: tanpa ini WebView file:// salah
         menebak encoding dan emoji/Unicode di UI jadi mojibake. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* Mobile: jangan seleksi teks atau buka menu konteks saat main. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      canvas {
        display: block;
        /* Long-press di canvas = Chrome mobile masuk "mouse mode" (toast
           "untuk menampilkan kursor...") lalu intercept pointer event;
           tanpa ini game beku setelah tap lama. Cegah seleksi teks +
           context menu di permukaan canvas. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
